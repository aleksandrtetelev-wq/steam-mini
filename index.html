<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Steam Top-Up</title>
    <!-- Подключаем Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1c1d22;
            --card-bg: #2b2d36;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-blue: #2aabee;
            --accent-green: #2ecc71;
            --border-color: #3f414a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Хедер */
        header {
            padding: 16px;
            background-color: rgba(43, 45, 54, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 24px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .back-btn:hover { opacity: 1; }
        .back-btn.disabled { pointer-events: none; opacity: 0.2; }

        h1 { font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }

        /* Основной контент */
        main {
            flex: 1;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .screen { display: none; animation: fadeIn 0.3s ease-out; }
        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Карточки */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent-blue); }

        /* Быстрые суммы */
        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .qa-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 0;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .qa-btn.selected {
            background-color: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
            transform: scale(1.05);
        }

        /* Итоговая цена */
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: bold;
        }
        .price-highlight { color: var(--accent-green); }

        /* Кнопки действий */
        .btn-primary {
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-success { background-color: var(--accent-green); }
        .btn-secondary { background-color: var(--border-color); color: white; }

        /* Экран успеха */
        .success-icon {
            font-size: 64px;
            text-align: center;
            margin: 20px 0;
            color: var(--accent-green);
        }
        .code-box {
            background-color: var(--bg-color);
            border: 1px dashed var(--accent-green);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-family: monospace;
            font-size: 18px;
            word-break: break-all;
            margin: 16px 0;
            position: relative;
        }
        .copy-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
        }

        /* Лоадер */
        .loader-container {
            height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header>
        <button id="backBtn" class="back-btn disabled" onclick="goBack()">←</button>
        <h1>Steam Top-Up</h1>
        <div style="width: 24px;"></div> <!-- Плейсхолдер для центрирования -->
    </header>

    <main>
        <!-- ЭКРАН 1: ГЛАВНАЯ -->
        <div id="screen-home" class="screen active">
            <div class="card">
                <label for="loginInput">Логин Steam</label>
                <input type="text" id="loginInput" placeholder="Например: Gamer_Pro">
            </div>

            <div class="card">
                <label for="amountInput">Сумма пополнения ($)</label>
                <input type="number" id="amountInput" value="10" min="5" max="500">
                
                <div class="quick-amounts">
                    <button class="qa-btn selected" data-val="5">$5</button>
                    <button class="qa-btn" data-val="10">$10</button>
                    <button class="qa-btn" data-val="20">$20</button>
                    <button class="qa-btn" data-val="50">$50</button>
                </div>
            </div>

            <div class="card" style="background: transparent; border: none; padding: 0;">
                <div class="summary-row">
                    <span>Комиссия (5%)</span>
                    <span id="commissionDisplay">$0.50</span>
                </div>
                <div class="total-row">
                    <span>Итого к оплате</span>
                    <span id="totalDisplay" class="price-highlight">$10.50</span>
                </div>
            </div>

            <button class="btn-primary" onclick="proceedToConfirm()">Продолжить →</button>
        </div>

        <!-- ЭКРАН 2: ПОДТВЕРЖДЕНИЕ -->
        <div id="screen-confirm" class="screen">
            <div class="card" style="text-align: center;">
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 8px;">Пополняем счет:</p>
                <h2 id="confirmLogin" style="margin-bottom: 24px; word-break: break-all;">User</h2>
                
                <div class="summary-row" style="justify-content: center; gap: 10px;">
                    <span>Баланс Steam:</span>
                    <span id="confirmBalance" class="price-highlight" style="font-weight: bold;">$10</span>
                </div>
                <div class="summary-row" style="justify-content: center; gap: 10px;">
                    <span>Оплата картой/crypto:</span>
                    <span id="confirmTotal" style="font-weight: bold;">$10.50</span>
                </div>
            </div>

            <button class="btn-primary btn-success" onclick="processPayment()">Оплатить <span id="payAmountText">$10.50</span></button>
        </div>

        <!-- ЭКРАН 3: ОБРАБОТКА -->
        <div id="screen-processing" class="screen">
            <div class="loader-container">
                <div class="spinner"></div>
                <p>Обрабатываем платеж...</p>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">Не закрывайте окно</p>
            </div>
        </div>

        <!-- ЭКРАН 4: УСПЕХ -->
        <div id="screen-success" class="screen">
            <div class="success-icon">✅</div>
            <h2 style="text-align: center; margin-bottom: 8px;">Успешно!</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px;">Ваш код готов.</p>
            
            <div class="code-box" id="walletCode">
                XXXXX-XXXXX-XXXXX
            </div>
            <p class="copy-hint">Нажмите на код, чтобы скопировать</p>

            <button class="btn-primary" onclick="openSteam()" style="margin-top: 24px;">Открыть Steam</button>
            <button class="btn-primary btn-secondary" onclick="resetApp()" style="margin-top: 12px;">Новый заказ</button>
        </div>
    </main>

    <script>
        // --- Инициализация Telegram ---
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Применяем тему Telegram, если доступна, иначе используем дефолт
        if(tg.themeParams.bg_color) document.documentElement.style.setProperty('--bg-color', tg.themeParams.bg_color);
        if(tg.themeParams.text_color) document.documentElement.style.setProperty('--text-main', tg.themeParams.text_color);
        if(tg.themeParams.button_color) document.documentElement.style.setProperty('--accent-blue', tg.themeParams.button_color);

        // --- Состояние приложения ---
        let currentScreen = 'home';
        const COMMISSION_RATE = 0.05;
        const MIN_AMOUNT = 5;
        const MAX_AMOUNT = 500;

        // --- DOM Elements ---
        const screens = {
            home: document.getElementById('screen-home'),
            confirm: document.getElementById('screen-confirm'),
            processing: document.getElementById('screen-processing'),
            success: document.getElementById('screen-success')
        };
        const backBtn = document.getElementById('backBtn');
        const loginInput = document.getElementById('loginInput');
        const amountInput = document.getElementById('amountInput');
        const commissionDisplay = document.getElementById('commissionDisplay');
        const totalDisplay = document.getElementById('totalDisplay');
        const qaButtons = document.querySelectorAll('.qa-btn');

        // --- Логика расчета цены ---
        function updatePrice() {
            let amount = parseFloat(amountInput.value) || 0;
            if (amount < 0) amount = 0;
            if (amount > MAX_AMOUNT) amount = MAX_AMOUNT;
            
            // Обновляем инпут, если пользователь вышел за пределы
            if(parseFloat(amountInput.value) !== amount) amountInput.value = amount;

            const commission = amount * COMMISSION_RATE;
            const total = amount + commission;

            commissionDisplay.textContent = `$${commission.toFixed(2)}`;
            totalDisplay.textContent = `$${total.toFixed(2)}`;
            
            // Обновляем данные на экране подтверждения
            document.getElementById('confirmBalance').textContent = `$${amount.toFixed(2)}`;
            document.getElementById('confirmTotal').textContent = `$${total.toFixed(2)}`;
            document.getElementById('payAmountText').textContent = `$${total.toFixed(2)}`;

            // Подсветка активных кнопок сумм
            qaButtons.forEach(btn => {
                if(parseInt(btn.dataset.val) === Math.round(amount)) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }

        // Слушатели событий
        amountInput.addEventListener('input', updatePrice);
        
        qaButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                amountInput.value = btn.dataset.val;
                updatePrice();
            });
        });

        // --- Навигация между экранами ---
        function showScreen(screenName) {
            Object.values(screens).forEach(el => el.classList.remove('active'));
            screens[screenName].classList.add('active');
            currentScreen = screenName;

            // Управление кнопкой назад
            if (screenName === 'home') {
                backBtn.classList.add('disabled');
            } else {
                backBtn.classList.remove('disabled');
            }
        }

        function goBack() {
            if (currentScreen === 'confirm') showScreen('home');
            else if (currentScreen === 'success') resetApp();
        }

        function proceedToConfirm() {
            const login = loginInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (!login) {
                tg.showAlert("Введите логин Steam");
                return;
            }
            if (isNaN(amount) || amount < MIN_AMOUNT || amount > MAX_AMOUNT) {
                tg.showAlert(`Сумма должна быть от $${MIN_AMOUNT} до $${MAX_AMOUNT}`);
                return;
            }

            document.getElementById('confirmLogin').textContent = login;
            showScreen('confirm');
        }

        async function processPayment() {
            showScreen('processing');
            
            // Имитация запроса к серверу (2 секунды)
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            // Генерация фейкового кода
            const code = generateRandomCode();
            document.getElementById('walletCode').textContent = code;
            
            // Вибрация успеха
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            showScreen('success');
        }

        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 25; i++) {
                if (i > 0 && i % 5 === 0) result += '-';
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function openSteam() {
            // Открываем страницу активации ключей
            window.open('https://store.steampowered.com/account/registerkey', '_blank');
        }

        function resetApp() {
            loginInput.value = '';
            amountInput.value = 10;
            updatePrice();
            showScreen('home');
        }

        // Копирование кода по клику
        document.getElementById('walletCode').addEventListener('click', function() {
            navigator.clipboard.writeText(this.textContent).then(() => {
                if(tg.showPopup) {
                    tg.showPopup({
                        title: 'Скопировано!',
                        message: 'Код скопирован в буфер обмена.',
                        buttons: [{type: 'ok'}]
                    });
                } else {
                    alert('Код скопирован!');
                }
            });
        });

        // Инициальный расчет
        updatePrice();

    </script>
</body>
                  </html>
